{"id": "sales-practice", "track": "selling", "title": "Best sales practice on the shop floor", "mins": 6, "body": "\n<p>Good selling at D Byk is not pressure. It is finding out what the rider needs, showing the right two or three bikes, and making the next step easy.</p>\n<h3>1. Greet and give space</h3>\n<p>Greet every customer within a few seconds of them walking in. Then let them look for a moment before you start. On the phone, give the store name and your own name.</p>\n<h3>2. Ask before you tell</h3>\n<p>Do not start with a bike. Start with the rider.</p>\n<ul>\n<li>What riding do you want to do, and how often?</li>\n<li>What distances, and on what roads?</li>\n<li>What are you riding now, and what do you not like about it?</li>\n<li>What is your height?</li>\n<li>What budget do you have in mind, including helmet and accessories?</li>\n</ul>\n<p>Listen to the whole answer. The customer should be talking more than you in the first few minutes.</p>\n<h3>3. Show three, not ten</h3>\n<p>Offer a good, better and best option that fit what they said. For each, give one reason in the customer's own words: \"You said your back hurts on long rides. This one sits you more upright.\" Too many options delay the decision.</p>\n<h3>4. Size and test ride</h3>\n<p>Put the customer on the bike. A bike that fits and has been ridden is far more likely to be bought, and far less likely to come back as a complaint.</p>\n<h3>5. Sell the whole ride</h3>\n<p>A bike without a helmet, lights, pump and bottle cage is not ready to ride. Offer these with the bike, not after the bill is made. Offer the ESP service plan at delivery.</p>\n<h3>6. Always agree the next step</h3>\n<p>If they are not buying today, agree a specific next step: a call on Thursday, a test ride on Saturday, a quote on WhatsApp in ten minutes. Take the phone number and put it in the CRM before they leave the store.</p>\n<h3>7. Follow up within a day</h3>\n<p>Contact the customer within 24 hours with something useful: the quote, the size confirmation, the stock answer. Most of our lost inquiries went quiet. The store that follows up gets the sale.</p>\n<h3>8. Deliver properly</h3>\n<ul>\n<li>Set saddle height and check the fit.</li>\n<li>Explain gears, brakes and tyre pressure.</li>\n<li>Explain the free tune-up within 30 days and the free Prime service within 6 months.</li>\n<li>For Trek, register the bike in the customer's name for the lifetime frame warranty.</li>\n<li>Ask for a Google review.</li>\n</ul>\n<h3>Never do these</h3>\n<ul>\n<li>Never guess a spec, a price or a delivery date. Check, then answer.</li>\n<li>Never run down another shop or brand.</li>\n<li>Never let a customer leave without a next step.</li>\n</ul>", "takeaways": ["Ask about the rider before showing a bike.", "Show three options, each with a reason in the customer's words.", "No customer leaves without an agreed next step and a CRM entry.", "Follow up within 24 hours with something useful."], "quiz": [{"q": "A customer walks in and says, 'Show me your best road bike.' What is the best first response?", "a": ["Ask what riding he does, how far, and his budget, then choose what to show", "Take him to the most expensive bike", "Hand him the price list", "Tell him about today's discount"], "why": "Ask before you tell. 'Best' depends on the rider."}, {"q": "How many options should you normally present after understanding the need?", "a": ["Three: good, better and best", "As many as possible, so he has choice", "One only", "None until he names a model"], "why": "Three focused options make deciding easier than ten."}, {"q": "A customer says he will think about it and starts to leave. What must happen before he goes?", "a": ["Agree a specific next step and record his number in the CRM", "Offer the maximum discount immediately", "Let him go and wait for his call", "Tell him the offer ends today when it does not"], "why": "Every conversation ends with a next step and a CRM entry. Never invent urgency."}, {"q": "When should helmet, lights and pump be offered?", "a": ["With the bike, before the bill is made", "After delivery, by phone", "Only if the customer asks", "Never, it looks pushy"], "why": "The bike is not ready to ride without them. Offer them as part of the sale."}, {"q": "A customer asks whether a bike takes 38 mm tyres and you are not sure. What do you do?", "a": ["Say you will check, check the spec, then answer", "Say yes so the sale moves on", "Say no to be safe", "Change the subject"], "why": "Never guess a spec. A wrong answer becomes a complaint later."}, {"q": "Which sentence presents a bike the right way?", "a": ["'You said your back hurts on long rides. This one sits you more upright.'", "'This has a 500 Series OCLV frame with IsoSpeed.'", "'This is our most popular model.'", "'Everyone buys this one.'"], "why": "Tie the feature to what the customer told you, in his words."}, {"q": "What must be done at delivery of a Trek bike that is specific to Trek?", "a": ["Register the bike in the customer's name for the lifetime frame warranty", "Remove the reflectors", "Change the tyres", "Offer a second bike"], "why": "The Trek lifetime frame warranty is for the registered first owner."}, {"q": "A customer compares us unfavourably with another shop. What should you never do?", "a": ["Run down the other shop", "Explain what we include with the bike", "Ask what matters most to him", "Offer a test ride"], "why": "Talk about what we offer. Never criticise competitors."}]},
{"id": "customers", "track": "selling", "title": "Handling different customers, and difficult moments", "mins": 6, "body": "\n<p>The same bike is sold differently to different people. Read the customer first, then choose how to talk.</p>\n<h3>Five customers you will meet</h3>\n<div class=\"scroll\"><table>\n<tr><th>Customer</th><th>How you know</th><th>What works</th></tr>\n<tr><td><b>The researcher</b></td><td>Quotes specs and reviews, has a shortlist</td><td>Respect the homework. Do not repeat the brochure. Add what the internet cannot: fit, a test ride, how the bike holds up in our workshop.</td></tr>\n<tr><td><b>The beginner</b></td><td>Unsure of terms, asks \"which is good?\"</td><td>Simple words, no jargon. Ask about use, narrow to two bikes, explain one difference.</td></tr>\n<tr><td><b>The price shopper</b></td><td>Opens with \"best price?\" or shows an online price</td><td>Do not start with a number. Find the need first, then show what our price includes: assembly, fit, free services, warranty support here in Pune.</td></tr>\n<tr><td><b>The parent</b></td><td>Buying for a child</td><td>Safety and fit first. Size the child, not the age on the label. Do not sell a bike to \"grow into\".</td></tr>\n<tr><td><b>The returning rider</b></td><td>Already owns a bike, wants an upgrade</td><td>Ask what the current bike does not do. Sell the difference, not the whole bike.</td></tr>\n</table></div>\n<h3>On the phone and WhatsApp</h3>\n<ul>\n<li>Answer with the store name and your name.</li>\n<li>Reply to WhatsApp within minutes during working hours. A slow reply is where most inquiries go quiet.</li>\n<li>Do not send a price alone. Send the price with one line of what it includes and a question that moves things forward: \"Would you like to try the size on Saturday?\"</li>\n</ul>\n<h3>When a customer is angry</h3>\n<p>Use four steps, in this order.</p>\n<ul>\n<li><b>Listen.</b> Let them finish. Do not interrupt or defend.</li>\n<li><b>Acknowledge.</b> \"I understand, you were told Friday and it is not ready. I am sorry about that.\"</li>\n<li><b>Confirm.</b> Repeat the problem back so they know you have it right.</li>\n<li><b>Own the next step.</b> Say what you will do and by when. Then do it, and call them before they call you.</li>\n</ul>\n<p>Do not argue, do not blame a colleague or a vendor in front of the customer, and do not promise what you cannot deliver. If the fix needs money back, a replacement or an exception to policy, tell the customer you are taking it to the owners today, and do so.</p>\n<h3>Small things that customers remember</h3>\n<ul>\n<li>Use their name.</li>\n<li>Remember what they ride. It is in the CRM notes.</li>\n<li>Call when you said you would, even if the answer is \"no update yet\".</li>\n</ul>", "takeaways": ["Read the customer first: researcher, beginner, price shopper, parent, returning rider.", "Never open with a price. Find the need, then show what the price includes.", "Angry customer: listen, acknowledge, confirm, own the next step.", "Call when you said you would, even with no update."], "quiz": [{"q": "A customer arrives with a three-bike shortlist and quotes reviews of each. How do you handle him?", "a": ["Respect his research and add what he cannot get online: fit, test ride, workshop experience", "Repeat the full brochure for each bike", "Tell him the reviews are wrong", "Show him ten more bikes"], "why": "The researcher needs what the internet cannot give."}, {"q": "A customer's first words are, 'What is your best price on this?' What do you do first?", "a": ["Ask what he needs the bike for, then explain what the price includes", "Give the lowest price you are allowed straight away", "Refuse to discuss price", "Ask him to come back later"], "why": "Do not open with a number. Find the need, then show the value."}, {"q": "A parent wants a bike two sizes too big so the child can 'grow into it'. What do you say?", "a": ["Explain that a bike that does not fit is unsafe, and size the child properly", "Agree, it saves them money", "Sell the biggest bike in stock", "Say nothing, the parent decides"], "why": "Safety and fit come first with children."}, {"q": "An angry customer is still explaining what went wrong with his service. What is the first step?", "a": ["Let him finish without interrupting or defending", "Explain why it was not your fault", "Offer a discount immediately", "Tell him the mechanic made the mistake"], "why": "Listen first. Acknowledge, confirm and own the next step after that."}, {"q": "A complaint can only be solved with a refund outside our policy. What do you tell the customer?", "a": ["That you are taking it to the owners today, and then do so", "That refunds are impossible, and end the conversation", "That you will refund it yourself right now", "That he should write an email to someone"], "why": "Exceptions go to the owners. Tell the customer the next step and when."}, {"q": "You promised to call a customer today about his order, but there is no news. What do you do?", "a": ["Call anyway and say there is no update yet, and when you will call next", "Wait until there is news", "Send nothing so he does not get upset", "Ask him to call the vendor"], "why": "Call when you said you would. Silence is what loses customers."}, {"q": "What is wrong with replying to a WhatsApp inquiry with only '₹85,299'?", "a": ["A price alone gives no reason to choose us and no next step", "The price should never be shared on WhatsApp", "It is too long", "Nothing, it is the ideal reply"], "why": "Send the price with what it includes and a question that moves things forward."}, {"q": "A returning rider wants to upgrade from his hybrid. What is the most useful question?", "a": ["What does your current bike not do for you?", "What is your salary?", "Do you want our most expensive bike?", "Why did you buy a hybrid?"], "why": "Sell the difference between what he has and what he needs."}]},
{"id": "objections", "track": "selling", "title": "Rejections and negotiation", "mins": 7, "body": "\n<p>An objection is not a rejection. It is the customer telling you what still stands between them and the bike. Handle it well and you are closer to the sale than before.</p>\n<h3>The four-step answer</h3>\n<ul>\n<li><b>Acknowledge</b>: \"That is fair.\" Never \"No, but\".</li>\n<li><b>Ask</b>: find the real concern. \"Is it the total, or is it more than you planned for this type of bike?\"</li>\n<li><b>Answer</b>: respond to that concern only.</li>\n<li><b>Confirm</b>: \"Does that sort it out?\" Then move to the next step.</li>\n</ul>\n<h3>Common objections</h3>\n<div class=\"scroll\"><table>\n<tr><th>They say</th><th>What it often means</th><th>What to do</th></tr>\n<tr><td>\"It is too expensive.\"</td><td>Over budget, or the value is not clear yet</td><td>Ask which. If over budget, show the model below. If value, explain what the price includes.</td></tr>\n<tr><td>\"I will think about it.\"</td><td>Something is unanswered</td><td>\"Of course. What would you like to be sure about?\" Then agree a follow-up day.</td></tr>\n<tr><td>\"It is cheaper online.\"</td><td>Comparing the box price only</td><td>Ask to see the listing. Check it is the same model, year and size. Explain assembly, fit, free services and local warranty support.</td></tr>\n<tr><td>\"I need to ask at home.\"</td><td>Another person decides</td><td>Offer to send details on WhatsApp for them, and invite both to the store.</td></tr>\n<tr><td>\"Another shop will give more discount.\"</td><td>Testing your price</td><td>Do not match blindly. Ask what exactly is included there, then use what you are allowed to offer.</td></tr>\n</table></div>\n<h3>Find out if it is the only thing</h3>\n<p>Before you move on price, ask: \"If we can sort out the price, are you ready to go ahead today?\" If the answer is no, price is not the real objection, and a discount will not close the sale.</p>\n<h3>Negotiating the D Byk way</h3>\n<ul>\n<li><b>Never open with a discount.</b> Sell the bike first. A discount offered before it is asked for is money given away.</li>\n<li><b>Know your limit before you start.</b> Discounts follow the Discount Authority Matrix: bikes by brand on MRP, accessories by invoice slab. Know the rupee floor for the bike in front of you, not only the percentage.</li>\n<li><b>Payment mode matters.</b> The extra discount is only for UPI, cash or bank transfer. It does not apply to card payments.</li>\n<li><b>Slashed prices.</b> If a bike already has a D Byk slashed price, any discount is worked on the slashed price, not on MRP.</li>\n<li><b>Mixed bills.</b> On a bill with a bike and accessories, each follows its own rule.</li>\n<li><b>Trade, do not give.</b> If you move, ask for something back: \"If I do this, can we bill it today?\"</li>\n</ul>\n<h3>When you must escalate</h3>\n<ul>\n<li>Bikes tagged <b>brand-offer</b>: the brand has already cut the price.</li>\n<li><b>Framesets</b>: these are custom builds.</li>\n<li>Anything below your floor.</li>\n</ul>\n<p>These go to Akshay. Tell the customer you will confirm and come back with an answer, and give a time. <b>Upgrade Bargains</b> items are final price, with no further discount at all.</p>\n<h3>When the answer is no</h3>\n<ul>\n<li>It is not personal. Stay warm. Customers return to the shop that treated them well when they said no.</li>\n<li>Ask one last question: \"What would have made this a yes?\" The answer is your real lost reason.</li>\n<li>Record the true reason in the CRM. If they are still deciding, keep the inquiry open with a follow-up date.</li>\n</ul>", "takeaways": ["Acknowledge, ask, answer, confirm.", "Check whether price is the only thing before you discount.", "Never open with a discount, know your rupee floor, and trade instead of giving.", "Brand-offer bikes, framesets and anything below floor go to Akshay. Upgrade Bargains are final."], "quiz": [{"q": "A customer says, 'It is too expensive.' What is the best next line?", "a": ["'That is fair. Is it more than you planned to spend, or are you not sure it is worth it?'", "'No, it is actually very cheap.'", "'I can give you a discount.'", "'Then this bike is not for you.'"], "why": "Acknowledge, then ask to find the real concern before answering."}, {"q": "Before moving on price, you ask, 'If we sort out the price, are you ready to go ahead today?' He says no. What does that tell you?", "a": ["Price is not the real objection, so a discount will not close the sale", "You should discount more", "He will never buy", "You should stop talking to him"], "why": "Isolate the objection first. If price is not the only thing, find what is."}, {"q": "A customer wants the extra discount and plans to pay by credit card. What is correct?", "a": ["The extra discount applies only to UPI, cash or bank transfer", "The extra discount applies to every payment mode", "Card payments get a bigger discount", "No discount of any kind is possible on a card"], "why": "The extra discount is tied to UPI, cash or bank transfer."}, {"q": "A bike has MRP ₹1,00,000 and a D Byk slashed price of ₹90,000. On which figure is any further discount worked out?", "a": ["The slashed price of ₹90,000", "The MRP of ₹1,00,000", "Whichever gives the lower price", "Neither, slashed bikes can never be discounted"], "why": "For slashed-price bikes the discount is on the slashed price, not MRP."}, {"q": "A customer asks for a discount on a frameset. What do you do?", "a": ["Tell him you will confirm with Akshay and come back with an answer by a set time", "Apply the normal bike discount", "Refuse and end the conversation", "Offer free wheels"], "why": "Framesets are custom builds, so discount questions escalate."}, {"q": "Which item can never be discounted further, even by escalating?", "a": ["An Upgrade Bargains product", "A Trek Domane at MRP", "A helmet on a mixed bill", "A hybrid paid by UPI"], "why": "Upgrade Bargains are final price."}, {"q": "A customer says another shop offers more discount on the same bike. What is the right response?", "a": ["Ask exactly what is included there, then work within what you are allowed to offer", "Match it immediately", "Tell him the other shop is lying", "End the conversation"], "why": "Do not match blindly. Compare like for like, then use your authority."}, {"q": "You agree to move a little on price. What should you ask for in return?", "a": ["A commitment, such as billing today", "Nothing, a discount is a gift", "A five-star review before delivery", "His friend's phone number"], "why": "Trade, do not give. A concession should close the sale."}]},
{"id": "trainers", "track": "gear", "title": "Indoor trainers: the range, the right pick, setup and use", "mins": 12, "body": "\n<p>An indoor trainer lets a customer ride their own bike at home. In Pune that means riding through the monsoon, before sunrise, or after work. We are an authorised Wahoo dealer and we also list Elite, Garmin Tacx, Magene and JetBlack, so we can fit almost any budget.</p>\n\n<h3>1. The types</h3>\n<div class=\"scroll\"><table>\n<tr><th>Type</th><th>How it works</th><th>Good and bad</th><th>In our range</th></tr>\n<tr><td><b>Wheel-on</b></td><td>The bike's rear wheel stays on. The tyre presses against a roller.</td><td>Cheapest and quick to mount. Louder, wears the tyre, less accurate.</td><td>Elite Qubo Fluid, Garmin Tacx Boost, Elite Tuo</td></tr>\n<tr><td><b>Direct drive</b></td><td>The rear wheel comes off. The chain runs on a cassette fixed to the trainer.</td><td>Quiet, accurate, realistic feel, no tyre wear. Costs more and needs the right cassette.</td><td>Wahoo KICKR CORE 2, KICKR v6 and KICKR MOVE, Elite Rivo, Avanti and Justo 2, Garmin Tacx FLUX and NEO 2T, Magene T500, JetBlack Victory</td></tr>\n<tr><td><b>Rollers</b></td><td>The whole bike sits on rolling drums. The rider balances.</td><td>Builds smooth pedalling and balance. Takes practice.</td><td>Garmin Tacx Antares. The Wahoo KICKR ROLLR is a smart version that holds the front wheel.</td></tr>\n<tr><td><b>Smart bike</b></td><td>A complete indoor bike. No outdoor bike needed.</td><td>Always ready, adjustable for several riders. Highest price.</td><td>Wahoo KICKR BIKE, Zwift Ride with KICKR CORE 2</td></tr>\n</table></div>\n\n<h3>2. Smart or not smart</h3>\n<p>A <b>smart trainer</b> connects to a phone, tablet or computer by Bluetooth or ANT+. It sends the rider's power to the app, and the app controls the resistance. When the road in the app goes uphill, pedalling gets harder. A basic trainer does neither. The rider changes resistance by hand or by shifting gears.</p>\n<p>The Elite Qubo Fluid and Garmin Tacx Boost are basic trainers. The Elite Tuo is a smart wheel-on trainer. Every direct drive trainer we list is smart.</p>\n<p>Smart trainers work in two modes:</p>\n<ul>\n<li><b>ERG mode</b>: the workout sets a power target, for example 180 watts, and the trainer holds the rider there whatever the cadence. The rider stays in one gear and just pedals.</li>\n<li><b>Simulation mode</b>: resistance follows the gradient of the virtual road. The rider shifts gears exactly as outdoors.</li>\n</ul>\n\n<h3>3. What separates a ₹60,000 trainer from a ₹1,60,000 one</h3>\n<ul>\n<li><b>Power accuracy</b>: mid-range trainers such as the KICKR CORE 2 measure within about 2%. Top trainers such as the KICKR v6 and Elite Justo 2 measure within about 1%.</li>\n<li><b>Maximum resistance and gradient</b>: top models resist harder sprints and simulate steeper climbs.</li>\n<li><b>Feel and noise</b>: heavier flywheels and better drives feel more like the road.</li>\n<li><b>Extras</b>: the KICKR MOVE slides forward and back as the rider pedals, which is more comfortable on long rides. The Tacx NEO 2T needs no calibration and can run without mains power.</li>\n</ul>\n<p>For most customers a mid-range direct drive trainer is the right answer. The top tier is for racers and riders who train by exact power numbers.</p>\n\n<h3>4. Our range by budget</h3>\n<div class=\"scroll\"><table>\n<tr><th>Budget</th><th>Trainers</th><th class=\"num\">Listed from</th></tr>\n<tr><td>Entry, basic</td><td>Elite Qubo Fluid, Garmin Tacx Boost, Tacx Antares rollers</td><td class=\"num\">₹16,990</td></tr>\n<tr><td>Entry, smart</td><td>Magene T110, Elite Tuo</td><td class=\"num\">₹31,900</td></tr>\n<tr><td>Mid, direct drive</td><td>JetBlack Victory, Elite Rivo, Wahoo KICKR CORE 2, Elite Avanti, Garmin Tacx FLUX S</td><td class=\"num\">₹59,200</td></tr>\n<tr><td>Top, direct drive</td><td>Elite Justo 2, Wahoo KICKR v6, Garmin Tacx NEO 2T, Wahoo KICKR MOVE</td><td class=\"num\">₹1,24,990</td></tr>\n<tr><td>Smart bikes</td><td>Zwift Ride with KICKR CORE 2, Wahoo KICKR BIKE</td><td class=\"num\">₹1,93,000</td></tr>\n</table></div>\n<p class=\"note\">Prices are our website listings in November 2026. They change, so check the site before you quote.</p>\n<h3>5. Zwift Cog and Click</h3>\n<p>Several trainers come in a version \"with Zwift Cog and Click\", including the KICKR CORE 2, Elite Avanti and JetBlack Victory. Instead of a cassette, the trainer has a single cog. The rider shifts with two small buttons on the handlebar, and the gears are virtual. The big advantage is that one trainer fits bikes from 8 to 12 speed with no cassette to match, so a family with different bikes can share it. Virtual shifting works in Zwift. A customer who uses other apps should take the normal version and a cassette.</p>\n\n<h3>6. Selling the right trainer: five questions</h3>\n<ul>\n<li><b>Which bike will go on it?</b> You need the number of gears, the brand of the drivetrain, and the rear axle type.</li>\n<li><b>What is the goal?</b> General fitness, structured training, or racing on Zwift.</li>\n<li><b>Where will it live?</b> In a flat with neighbours below, recommend direct drive because it is much quieter.</li>\n<li><b>Which screen will you use?</b> Phone, tablet, laptop or Apple TV. Apps such as Zwift need their own paid subscription, so say so.</li>\n<li><b>What is the budget, including the extras?</b></li>\n</ul>\n\n<h3>7. The three compatibility checks</h3>\n<div class=\"scroll\"><table>\n<tr><th>Check</th><th>What to know</th></tr>\n<tr><td><b>Cassette</b></td><td>Many direct drive trainers are sold without a cassette. The customer needs one with the same number of gears as their bike. Sell it with the trainer, or sell the Zwift Cog version.</td></tr>\n<tr><td><b>Freehub body</b></td><td>Trainers come with a Shimano HG freehub, which takes Shimano road cassettes and many SRAM ones. A SRAM 12-speed AXS road bike uses an XDR cassette and needs an XDR freehub body for the trainer. We stock them for Elite, Magene and Tacx.</td></tr>\n<tr><td><b>Axle</b></td><td>Quick release or thru-axle. Most trainers include adapters for both. Check the box before the customer leaves.</td></tr>\n</table></div>\n<p>For a wheel-on trainer, also recommend a trainer tyre. A normal road tyre wears fast and slips on the roller.</p>\n\n<h3>8. Setting it up</h3>\n<ul>\n<li>Put a mat on a firm, level floor, near a power socket.</li>\n<li>Fit the cassette and the correct axle adapters to the trainer.</li>\n<li>Shift the bike to the smallest cog, remove the rear wheel, and lower the chain onto the trainer's cassette. Tighten the axle.</li>\n<li>Plug the trainer in. Open the maker's app, such as the Wahoo app, pair the trainer and update its firmware.</li>\n<li>Run a calibration, also called a spindown, if the app asks for one.</li>\n<li>Open the training app and pair the trainer there as the power source and as the controllable trainer.</li>\n</ul>\n<p>If the gears skip on the trainer but not on the road, the rear derailleur needs a small adjustment, because the trainer's cassette sits in a slightly different position from the wheel's.</p>\n\n<h3>9. Using it well</h3>\n<ul>\n<li><b>Use a fan.</b> Indoors there is no wind. Without a fan the rider overheats within minutes.</li>\n<li><b>Protect the bike from sweat.</b> Sweat corrodes the handlebar, stem and headset. A towel or sweat guard over the top tube and a wipe-down after each ride prevent it.</li>\n<li><b>Connection drops?</b> A trainer usually accepts one Bluetooth connection at a time. Close other apps that are connected to it.</li>\n<li><b>In ERG mode</b>, stay in one gear and keep the cadence steady.</li>\n<li>Wipe the trainer down and keep its firmware updated.</li>\n</ul>\n\n<h3>10. What to sell with every trainer</h3>\n<p>Floor mat, fan (the Wahoo KICKR Headwind changes speed with the rider's effort), sweat guard, a cassette or XDR freehub if needed, and a trainer table or tablet stand. Offer them before the bill is made. A customer who goes home without a cassette cannot ride that night.</p>\n", "takeaways": ["Wheel-on is cheap and loud. Direct drive is quiet and accurate. Rollers train balance. Smart bikes need no outdoor bike.", "Smart means the app reads power and controls resistance. ERG holds a power target, simulation follows the gradient.", "Check three things: cassette, freehub body, axle.", "Zwift Cog and Click: one cog, virtual gears, fits 8 to 12 speed bikes, works in Zwift.", "Always sell the mat, the fan and sweat protection with the trainer."], "quiz": [{"q": "A customer lives in a third-floor flat, wants to train at 5 am, and has ₹80,000. Which type do you recommend?", "a": ["A direct drive smart trainer, because it is much quieter", "A wheel-on trainer, because it is cheapest", "Rollers, because they are simplest", "A basic fluid trainer with a trainer tyre"], "why": "Direct drive trainers are quiet and fit the budget. Wheel-on trainers are louder."}, {"q": "What makes a trainer 'smart'?", "a": ["It sends power to an app and the app controls its resistance", "It has a heavier flywheel", "It folds for storage", "It works without a bike"], "why": "Smart trainers connect by Bluetooth or ANT+ and are controlled by the app."}, {"q": "A workout asks for 200 watts in ERG mode. The rider slows his cadence. What does the trainer do?", "a": ["It raises resistance so he still produces 200 watts", "It lowers the target to match him", "Nothing changes", "It switches to simulation mode"], "why": "In ERG mode the trainer holds the power target whatever the cadence."}, {"q": "A customer has a SRAM 12-speed AXS road bike and is buying a direct drive trainer with a standard freehub. What else does he need?", "a": ["An XDR freehub body for the trainer, and an XDR cassette", "Nothing, any cassette fits", "A trainer tyre", "A new rear derailleur"], "why": "SRAM AXS road uses XDR. Trainers ship with a Shimano HG freehub."}, {"q": "A family wants one trainer for an 8-speed hybrid and an 11-speed road bike, and they will use Zwift. What is the simplest solution?", "a": ["A trainer with Zwift Cog and Click", "Two trainers", "An 11-speed cassette for both bikes", "A wheel-on basic trainer"], "why": "The single cog with virtual shifting fits bikes from 8 to 12 speed."}, {"q": "A customer wants a Zwift Cog and Click trainer but says he will train only in another app, not Zwift. What do you advise?", "a": ["Take the normal version with a cassette, because virtual shifting works in Zwift", "The Cog version works the same in every app", "Buy rollers", "Buy a smart bike"], "why": "Virtual shifting is a Zwift feature. For other apps he needs real gears."}, {"q": "Which of these trainers is NOT a smart trainer?", "a": ["Elite Qubo Fluid", "Wahoo KICKR CORE 2", "Elite Tuo", "Magene T110"], "why": "The Qubo Fluid is a basic fluid trainer. The Tuo is a smart wheel-on trainer."}, {"q": "What is the main difference a customer pays for between a KICKR CORE 2 and a KICKR v6?", "a": ["Better power accuracy, about 1% against about 2%, and more resistance", "The v6 is wheel-on", "The CORE 2 is not smart", "The v6 needs no bike"], "why": "Both are smart direct drive trainers. The top tier is more accurate and more powerful."}, {"q": "After mounting the bike on a direct drive trainer, the gears skip, although they were fine on the road. What is the usual fix?", "a": ["A small rear derailleur adjustment", "A new chain", "A different app", "A trainer tyre"], "why": "The trainer's cassette sits slightly differently from the wheel's, so indexing may need a tweak."}, {"q": "Why must sweat be kept off the bike during indoor riding?", "a": ["It corrodes the handlebar, stem and headset", "It makes the trainer louder", "It stops Bluetooth working", "It wears the tyre"], "why": "Indoors there is no wind to dry sweat, and it drips straight onto the front of the bike."}, {"q": "A customer's trainer will not connect to Zwift on his laptop. His phone is nearby with the Wahoo app open. What do you suggest first?", "a": ["Close the app on the phone, because the trainer usually accepts one Bluetooth connection at a time", "Return the trainer", "Buy a new cassette", "Run in ERG mode"], "why": "Another app holding the Bluetooth connection is the most common cause."}, {"q": "Which item should always be offered with a direct drive trainer sold without a cassette?", "a": ["A cassette matching the bike's number of gears", "A trainer tyre", "A front wheel", "A bottle cage"], "why": "Without the right cassette the customer cannot ride. A trainer tyre is only for wheel-on trainers."}]},
{"id": "wheels", "track": "gear", "title": "Wheels, tyres, rotors and freehubs: choosing the right wheelset", "mins": 12, "body": "\n<p>A wheelset is the biggest upgrade a customer can make to a stock bike. It is also the easiest part to sell wrongly, because a wheel has to match the frame, the brakes, the drivetrain and the tyres. This lesson gives you the checks in order.</p>\n\n<h3>1. What a wheel is made of</h3>\n<ul>\n<li><b>Rim</b>: aluminium (alloy) or carbon. Alloy is cheaper and tougher. Carbon is lighter for the same depth and can be made deep and aero.</li>\n<li><b>Hub</b>: the centre. It holds the axle, the bearings, the brake rotor mount and, on the rear, the freehub body.</li>\n<li><b>Spokes</b>: connect the two.</li>\n<li><b>Freehub body</b>: the splined part of the rear hub that the cassette slides onto.</li>\n</ul>\n\n<h3>2. Wheel sizes</h3>\n<ul>\n<li><b>700c</b>: road, gravel and hybrid. A 29 inch mountain bike wheel has the same rim diameter.</li>\n<li><b>650b</b>: the same rim diameter as a 27.5 inch mountain bike wheel. Used on some gravel bikes and smaller frames.</li>\n</ul>\n\n<h3>3. Brake type: the first check</h3>\n<p>A wheel is built for rim brakes or for disc brakes, never both. A rim brake wheel has a braking surface on the rim and no rotor mount. A disc wheel has a rotor mount on the hub and no braking surface. We list both: for example the Token Konax Pro 52 comes in a rim brake version and a disc version. Ask before anything else.</p>\n\n<h3>4. Rotors</h3>\n<div class=\"scroll\"><table>\n<tr><th>Topic</th><th>What to know</th></tr>\n<tr><td><b>Mount</b></td><td><b>Centerlock</b>: the rotor slides onto splines and one lockring holds it. <b>6-bolt</b>: six small bolts hold it. A 6-bolt rotor can go on a Centerlock hub with an adapter. A Centerlock rotor cannot go on a 6-bolt hub.</td></tr>\n<tr><td><b>Size</b></td><td>Road: 140 or 160 mm. Mountain bike: 160, 180 or 203 mm. Bigger rotors give more braking power and cope better with heat on long descents.</td></tr>\n<tr><td><b>Limits</b></td><td>The frame and fork set the smallest and largest rotor that fits. Check before changing size.</td></tr>\n</table></div>\n\n<h3>5. Axles</h3>\n<ul>\n<li><b>Quick release</b>: a thin skewer with a lever. Found on rim brake bikes and older or entry disc bikes.</li>\n<li><b>Thru-axle</b>: a thick axle that threads into the frame. Road and gravel disc: 12 x 100 mm front, 12 x 142 mm rear. Mountain bike Boost: 15 x 110 mm front, 12 x 148 mm rear.</li>\n</ul>\n<p>The listing tells you. \"Mavic Cosmic SL 45 Disc, Centerlock 12x100/12x142\" means disc brake, Centerlock rotors, road thru-axles. A road wheel will not fit a Boost mountain bike frame.</p>\n\n<h3>6. Freehub bodies: Shimano and SRAM</h3>\n<p>The cassette decides the freehub body. Get this wrong and the customer's cassette will not go onto the new wheel.</p>\n<div class=\"scroll\"><table>\n<tr><th>Freehub body</th><th>Takes these cassettes</th></tr>\n<tr><td><b>Shimano HG</b></td><td>Shimano 8 to 11 speed, Shimano 12-speed road (105, Ultegra, Dura-Ace), and SRAM cassettes whose smallest cog is 11 teeth.</td></tr>\n<tr><td><b>SRAM XDR</b></td><td>SRAM 12-speed AXS road cassettes, which start at a 10-tooth cog.</td></tr>\n<tr><td><b>SRAM XD</b></td><td>SRAM Eagle mountain bike cassettes that start at 10 teeth. XD is slightly shorter than XDR. An XD cassette fits an XDR body with a spacer.</td></tr>\n<tr><td><b>Shimano Micro Spline</b></td><td>Shimano 12-speed mountain bike cassettes.</td></tr>\n</table></div>\n<p>The quick test: a cassette with a <b>10-tooth</b> smallest cog never fits a Shimano HG body. On most hubs the freehub body can be swapped, and we stock XDR bodies for several brands. Check that one is available for that wheel before you promise it.</p>\n\n<h3>7. Tyre systems</h3>\n<ul>\n<li><b>Clincher</b>: tyre plus inner tube. Simple, and easy to fix at the roadside.</li>\n<li><b>Tubeless</b>: no tube. An airtight tyre, rim tape, a tubeless valve and liquid sealant. It runs at lower pressure for more grip and comfort, and the sealant closes small punctures. It needs a tubeless-ready rim and a tubeless tyre. \"Tubeless Ready\" or \"UST\" in a wheel's name tells you the rim is.</li>\n<li><b>Tubular</b>: the tyre is glued to the rim. Used on the track and by some racers. Not for everyday riders.</li>\n</ul>\n<p><b>Hookless rims</b>: some carbon rims have straight inner walls with no hook. They must be used with tubeless tyres approved for hookless rims, and at no more than 5 bar (72.5 psi). Tell the customer both points.</p>\n<p><b>Width</b>: modern rims are wider inside, about 21 to 25 mm, which suits 28 to 32 mm tyres. Check the frame's tyre clearance before selling a wider tyre.</p>\n\n<h3>8. Rim depth</h3>\n<div class=\"scroll\"><table>\n<tr><th>Depth</th><th>Good for</th><th>Trade-off</th></tr>\n<tr><td><b>Shallow, under 35 mm</b></td><td>Climbing, light riders, windy days</td><td>Least aero</td></tr>\n<tr><td><b>Mid, 40 to 50 mm</b></td><td>All-round riding. The best single wheelset for most riders.</td><td>A little heavier than shallow</td></tr>\n<tr><td><b>Deep, 55 mm and more</b></td><td>Flat roads, time trials, triathlon</td><td>Heavier, and crosswinds push the front wheel</td></tr>\n</table></div>\n<p>A deeper rim cuts through air better, so it is faster on flat roads at speed. It also weighs more and catches crosswinds, and a light rider feels that most. That is why some sets are mixed: the Magene EXAR DB508 is 50 mm front and 58 mm rear. The shallower front wheel keeps the steering calm, and the deeper rear adds speed where wind matters less.</p>\n\n<h3>9. Our range at a glance</h3>\n<div class=\"scroll\"><table>\n<tr><th>Use</th><th>Wheelsets</th><th class=\"num\">Listed from</th></tr>\n<tr><td>Alloy, training and replacement</td><td>DT Swiss P1850 Spline, Shimano RS171, Token Resolute C22A (rim brake), Gist CL Alloy 42</td><td class=\"num\">₹17,000</td></tr>\n<tr><td>Carbon, mid depth</td><td>Elite Wheels Marvel 50D, Magene EXAR Pro DB45, Token Resolute C45D, Mavic Cosmic SL 45</td><td class=\"num\">₹70,999</td></tr>\n<tr><td>Carbon, deep</td><td>Magene EXAR Ultra DB508, Elite Wheels Drive Helix 57D, Vision SC 55 and SC 60</td><td class=\"num\">₹1,05,900</td></tr>\n<tr><td>Gravel</td><td>QUAI G50</td><td class=\"num\">₹48,500</td></tr>\n<tr><td>Mountain bike</td><td>Token Prime 29 inch Boost</td><td class=\"num\">₹39,390</td></tr>\n<tr><td>Track</td><td>Token Resolute Track, Mavic Ellipse Pro Carbon</td><td class=\"num\">₹26,990</td></tr>\n</table></div>\n<p class=\"note\">Prices are our website listings in November 2026. They change, so check the site before you quote.</p>\n<p>Do not confuse two brands: <b>Elite Wheels</b> makes carbon wheelsets. <b>Elite</b> is the Italian company that makes indoor trainers. They are not the same company.</p>\n\n<h3>10. Choosing the wheel: the order to ask</h3>\n<ul>\n<li><b>Brake</b>: rim or disc? If disc, Centerlock or 6-bolt rotors?</li>\n<li><b>Axle</b>: quick release or thru-axle, and which size?</li>\n<li><b>Drivetrain</b>: which cassette, so which freehub body?</li>\n<li><b>Tyres</b>: what width fits the frame, and does the customer want tubeless?</li>\n<li><b>Riding</b>: hills or flat, racing or training, how windy, how heavy is the rider?</li>\n<li><b>Budget</b>.</li>\n</ul>\n<p>The first four decide what <em>fits</em>. The last two decide what is <em>best</em>. Never skip to depth and price before the fit questions are answered.</p>\n\n<h3>11. Matching wheel to rider</h3>\n<ul>\n<li>Rides ghats every weekend, 60 kg: shallow to mid depth, around 35 to 45 mm.</li>\n<li>One wheelset for everything: 40 to 50 mm.</li>\n<li>Flat-road racer or triathlete: 55 mm and deeper, or a mixed-depth set.</li>\n<li>Daily training and bad roads: a tough alloy set, and keep the carbon set for events.</li>\n</ul>\n<p>With every wheelset, check whether the customer also needs rotors, a cassette, tubeless valves and sealant, and rim brake pads for carbon rims if the wheels are rim brake.</p>\n", "takeaways": ["Fit first: brake type, axle, freehub, tyre. Then depth and budget.", "Rim brake and disc wheels are never interchangeable. Centerlock hubs take 6-bolt rotors with an adapter, not the other way round.", "A 10-tooth smallest cog never fits Shimano HG. SRAM AXS road needs XDR.", "Mid depth, 40 to 50 mm, is the best all-round choice. Deep is for flat speed and costs weight and crosswind stability.", "Hookless rims: approved tubeless tyres only, 5 bar maximum."], "quiz": [{"q": "A customer wants to fit a rim brake carbon wheelset to his disc brake road bike. What do you tell him?", "a": ["It cannot be done. A wheel is built for rim brakes or disc brakes, never both", "It works with a rotor adapter", "It works on the front only", "It works if he changes brake pads"], "why": "Rim brake wheels have no rotor mount, and disc frames have no rim brake calipers."}, {"q": "A customer's hubs are 6-bolt and he has bought Centerlock rotors. Will they fit?", "a": ["No. A Centerlock rotor cannot go on a 6-bolt hub", "Yes, with an adapter", "Yes, they are the same", "Only on the rear wheel"], "why": "The adapter works one way only: 6-bolt rotors onto Centerlock hubs."}, {"q": "A listing reads 'Disc Wheelset, Centerlock 12x100/12x142'. What does 12x142 describe?", "a": ["The rear thru-axle: 12 mm diameter, 142 mm wide", "The rim depth and width", "The rotor size", "The tyre size"], "why": "12 x 100 is the front and 12 x 142 the rear road thru-axle."}, {"q": "A customer's bike has SRAM 12-speed AXS road gearing. Which freehub body must the new rear wheel have?", "a": ["SRAM XDR", "Shimano HG", "Shimano Micro Spline", "Any, they are all the same"], "why": "SRAM AXS road cassettes start at 10 teeth and need XDR."}, {"q": "A customer has Shimano 105 12-speed. The wheelset is listed as 'Shimano 11/12 Speed Hub'. Is it compatible?", "a": ["Yes. Shimano 12-speed road cassettes fit the Shimano HG body", "No, he needs XDR", "No, he needs Micro Spline", "Only with a spacer from SRAM"], "why": "Shimano 12-speed road uses the HG body. Micro Spline is for Shimano 12-speed mountain bike."}, {"q": "What is the quick test that a cassette will not fit a Shimano HG freehub body?", "a": ["Its smallest cog has 10 teeth", "It has 11 cogs", "It is made by SRAM", "It is silver"], "why": "10-tooth cassettes need XDR, XD or Micro Spline. Some SRAM cassettes starting at 11 teeth do fit HG."}, {"q": "A 58 kg rider climbs ghats every weekend and rides in gusty wind. Which rim depth suits her best?", "a": ["Shallow to mid, around 35 to 45 mm", "60 mm front and rear", "A rear disc wheel", "The deepest available, for speed"], "why": "Light riders are pushed around most by crosswinds, and climbing favours lower weight."}, {"q": "Why do some wheelsets have a shallower front rim than rear, such as 50 mm front and 58 mm rear?", "a": ["The shallower front keeps steering stable in crosswinds, and the deeper rear adds aero speed", "The front tyre is smaller", "It makes the bike lighter at the back", "It is only for looks"], "why": "Crosswind acts on the steering through the front wheel, so the front is kept shallower."}, {"q": "A customer has bought hookless carbon rims. Which advice is correct?", "a": ["Use tubeless tyres approved for hookless rims, and do not exceed 5 bar", "Any clincher tyre with a tube at 8 bar is fine", "Only tubular tyres fit", "Tyre pressure does not matter"], "why": "Hookless rims need approved tubeless tyres and have a 5 bar (72.5 psi) limit."}, {"q": "What does a customer need to run tubeless, apart from a tubeless-ready rim?", "a": ["A tubeless tyre, rim tape, a tubeless valve and sealant", "Only an inner tube", "Glue", "A deeper rim"], "why": "Tubeless replaces the tube with an airtight tyre and liquid sealant."}, {"q": "A customer asks for 'your fastest 60 mm wheels' for his road bike. What should you ask first?", "a": ["Brake type, axle and which cassette he runs", "Which colour decals he likes", "Nothing, show the most expensive set", "Whether he wants a bottle cage"], "why": "Fit comes first: brake, axle, freehub and tyre. Depth and price come after."}, {"q": "A customer asks whether an 'Elite' wheelset comes from the same company as his Elite trainer. What is correct?", "a": ["No. Elite Wheels makes wheelsets, and Elite is a separate Italian trainer maker", "Yes, it is one company", "Elite only makes tyres", "Both are Wahoo brands"], "why": "They share a name only."}]},
{"id": "events", "track": "events", "title": "Events our customers train for: brevets, triathlon, Hyrox and more", "mins": 10, "body": "\n<p>Most serious customers are training for something. If you know the event, you know the distance, the rules and the kit they need before they ask. Make \"What are you training for?\" a standard question in every conversation.</p>\n\n<h3>1. Brevets (BRM)</h3>\n<p>A brevet is a long-distance ride that must be finished inside a time limit. It is not a race: there are no rankings, only finishers. In India brevets are run by local clubs under Audax India Randonneurs, and Pune has an active club. Riders are called randonneurs.</p>\n<div class=\"scroll\"><table>\n<tr><th>Distance</th><th class=\"num\">Time limit</th></tr>\n<tr><td>200 km</td><td class=\"num\">13 h 30 min</td></tr>\n<tr><td>300 km</td><td class=\"num\">20 h</td></tr>\n<tr><td>400 km</td><td class=\"num\">27 h</td></tr>\n<tr><td>600 km</td><td class=\"num\">40 h</td></tr>\n</table></div>\n<ul>\n<li>The clock never stops. Food stops, punctures and sleep all count inside the limit.</li>\n<li>Riders pass <b>controls</b> along the route, each with its own closing time.</li>\n<li>Brevets are <b>self-supported</b>. No support car may follow the rider. They carry or buy what they need.</li>\n<li>Front and rear lights and a reflective vest are compulsory for night riding.</li>\n<li>A rider who finishes a 200, 300, 400 and 600 in one season earns the title <b>Super Randonneur</b>.</li>\n<li>The famous goal is <b>Paris-Brest-Paris</b>: 1,200 km in 90 hours, held in France every four years.</li>\n</ul>\n<p><b>What a brevet rider buys:</b> an endurance road bike such as the Trek Domane, 28 to 32 mm tyres, two sets of lights with a backup, a reflective vest, frame and saddle bags, a GPS computer with long battery life, a power bank, spare tubes and tools, nutrition, and a bike fit. Offer a full service a week before the ride, not the day before.</p>\n\n<h3>2. Triathlon and Ironman</h3>\n<p>A triathlon is swim, then bike, then run, with no break. The changeovers are called transitions: T1 from swim to bike, T2 from bike to run.</p>\n<div class=\"scroll\"><table>\n<tr><th>Distance</th><th class=\"num\">Swim</th><th class=\"num\">Bike</th><th class=\"num\">Run</th></tr>\n<tr><td>Sprint</td><td class=\"num\">750 m</td><td class=\"num\">20 km</td><td class=\"num\">5 km</td></tr>\n<tr><td>Olympic</td><td class=\"num\">1.5 km</td><td class=\"num\">40 km</td><td class=\"num\">10 km</td></tr>\n<tr><td>Half, or Ironman 70.3</td><td class=\"num\">1.9 km</td><td class=\"num\">90 km</td><td class=\"num\">21.1 km</td></tr>\n<tr><td>Full, or Ironman</td><td class=\"num\">3.8 km</td><td class=\"num\">180 km</td><td class=\"num\">42.2 km</td></tr>\n</table></div>\n<ul>\n<li><b>Ironman</b> is a brand name for full and half distance races. \"70.3\" is the total distance of the half in miles. A full Ironman must be finished within 17 hours.</li>\n<li>India hosts an Ironman 70.3 in Goa, and many customers travel abroad for a full.</li>\n<li>Most long races are <b>non-drafting</b>: riders must keep a gap, and triathlon bikes are allowed. <b>Draft-legal</b> races require a road bike.</li>\n</ul>\n<p><b>What a triathlete buys:</b> for a first sprint or Olympic race, a road bike with clip-on aero bars is enough. For 70.3 and full distance, a triathlon bike with a proper fit. Then a tri suit, a multisport watch from Garmin or Coros that records all three sports in one go, an indoor trainer for weekday training, hydration for the bike, nutrition, and a bike box for travel.</p>\n\n<h3>3. Duathlon and aquathlon</h3>\n<ul>\n<li><b>Duathlon</b>: run, bike, run. No swim. Popular with cyclists who do not swim.</li>\n<li><b>Aquathlon</b>: swim and run. No bike.</li>\n</ul>\n<p>A duathlete needs the same bike setup as a triathlete of that distance.</p>\n\n<h3>4. Hyrox</h3>\n<p>Hyrox is an indoor fitness race. Every event in the world uses the same format, so times can be compared. The athlete runs 1 km, then does one workout station, and repeats this eight times: 8 km of running and 8 stations in total.</p>\n<div class=\"scroll\"><table>\n<tr><th>Station</th><th>Workout</th></tr>\n<tr><td>1</td><td>SkiErg, 1,000 m</td></tr>\n<tr><td>2</td><td>Sled push, 50 m</td></tr>\n<tr><td>3</td><td>Sled pull, 50 m</td></tr>\n<tr><td>4</td><td>Burpee broad jumps, 80 m</td></tr>\n<tr><td>5</td><td>Rowing, 1,000 m</td></tr>\n<tr><td>6</td><td>Farmers carry, 200 m</td></tr>\n<tr><td>7</td><td>Sandbag lunges, 100 m</td></tr>\n<tr><td>8</td><td>Wall balls</td></tr>\n</table></div>\n<p>People enter alone, as doubles, or as a relay team. There is no cycling in Hyrox, so do not try to sell a bike for it. <b>What a Hyrox athlete buys from us:</b> a sports watch with heart rate, a heart rate strap, Shokz open-ear headphones for training, hydration and nutrition. Many also use an indoor trainer or smart bike for low-impact fitness between running days.</p>\n\n<h3>5. Other events you will hear about</h3>\n<div class=\"scroll\"><table>\n<tr><th>Event</th><th>What it is</th></tr>\n<tr><td><b>Cyclothon or gran fondo</b></td><td>A mass-participation road ride, often 25 to 100 km. Timed, with helmets compulsory. Many first-time buyers come in because of one.</td></tr>\n<tr><td><b>Ultra race</b></td><td>A non-stop long-distance race, such as the Deccan Cliffhanger from Pune to Goa. Unlike a brevet it is a race, and riders have a support crew and vehicle.</td></tr>\n<tr><td><b>Time trial</b></td><td>Each rider starts alone and races the clock. This is where TT bikes and deep wheels are used.</td></tr>\n<tr><td><b>Criterium</b></td><td>A short, fast race of many laps on a closed circuit.</td></tr>\n<tr><td><b>MTB race</b></td><td>Cross-country races on trails, from a single day to multi-day stage races.</td></tr>\n<tr><td><b>Everesting</b></td><td>Riding one climb again and again in a single ride until the total climbing reaches 8,848 m, the height of Everest.</td></tr>\n<tr><td><b>Marathon and ultra running</b></td><td>42.2 km and longer. These customers buy watches, headphones and nutrition.</td></tr>\n</table></div>\n\n<h3>6. Brevet or ultra race: do not mix them up</h3>\n<ul>\n<li>Brevet: not a race, self-supported, no follow car.</li>\n<li>Ultra race: a race, with a crew and a support vehicle.</li>\n</ul>\n<p>The kit is different. A brevet rider carries everything on the bike and needs bags. An ultra racer keeps spares in the car and wants the bike light and fast.</p>\n\n<h3>7. Using events to sell well</h3>\n<ul>\n<li>Ask what they are training for, and <b>when</b>. Put the event and date in the CRM note.</li>\n<li>Work backwards. A bike should be bought and fitted at least 6 to 8 weeks before the event. Nothing new on race day: no new saddle, shoes or position in the last week.</li>\n<li>Book the pre-event service about a week ahead.</li>\n<li>Follow up after the event. Ask how it went. That call often leads to the next purchase and a review.</li>\n<li>Be honest about what the event does not need. A first 200 km brevet does not need a carbon race bike.</li>\n</ul>\n", "takeaways": ["Brevets: 200 km in 13.5 h, 300 in 20 h, 400 in 27 h, 600 in 40 h. Self-supported, not a race.", "Triathlon: sprint, Olympic, 70.3 and full. Road bike with clip-ons for short races, tri bike for long ones.", "Hyrox: 8 x 1 km run plus 8 stations. No bike. Sell wearables, audio and nutrition.", "Ask what they are training for and when. Nothing new in the last week before an event."], "quiz": [{"q": "A customer is riding his first 200 km brevet. What is the time limit?", "a": ["13 hours 30 minutes", "10 hours", "20 hours", "24 hours"], "why": "200 km in 13 h 30 min, 300 in 20 h, 400 in 27 h, 600 in 40 h."}, {"q": "A brevet rider asks if his friend can follow him in a car with spares and food. What is the rule?", "a": ["No. Brevets are self-supported, and no support vehicle may follow the rider", "Yes, that is normal", "Yes, but only at night", "Only on a 600 km brevet"], "why": "Brevets are self-supported. Support cars belong to ultra races."}, {"q": "What must a rider complete in one season to become a Super Randonneur?", "a": ["A 200, 300, 400 and 600 km brevet", "Four 200 km brevets", "Paris-Brest-Paris", "One 1,000 km ride"], "why": "The series of 200, 300, 400 and 600 earns the title."}, {"q": "Which items are compulsory for the night section of a brevet?", "a": ["Front and rear lights and a reflective vest", "Aero bars", "A power meter", "A support car"], "why": "Lights and a reflective vest are required for night riding."}, {"q": "What are the three legs of an Ironman 70.3?", "a": ["1.9 km swim, 90 km bike, 21.1 km run", "3.8 km swim, 180 km bike, 42.2 km run", "1.5 km swim, 40 km bike, 10 km run", "750 m swim, 20 km bike, 5 km run"], "why": "70.3 is the half distance. The full is 3.8, 180 and 42.2."}, {"q": "A customer has entered his first Olympic distance triathlon and owns a road bike. What is the honest recommendation?", "a": ["Keep the road bike and add clip-on aero bars", "Buy a triathlon bike immediately", "Buy a mountain bike", "Buy a track frameset"], "why": "A road bike with clip-ons is enough for sprint and Olympic distance."}, {"q": "What does a multisport watch do that matters to a triathlete?", "a": ["It records swim, bike and run in one continuous activity", "It replaces the bike computer on brevets only", "It makes the bike UCI-legal", "It measures tyre pressure"], "why": "Garmin and Coros multisport watches track all three legs and the transitions."}, {"q": "How is a Hyrox race structured?", "a": ["A 1 km run followed by a workout station, repeated eight times", "A swim, a bike and a run", "A 180 km bike ride", "Eight 5 km runs"], "why": "8 km of running and 8 stations in total, the same at every event."}, {"q": "A customer training for Hyrox walks in. Which of these is the right thing to offer?", "a": ["A sports watch, heart rate strap, headphones and nutrition", "A TT bike, because Hyrox has a bike leg", "Brevet lights and a reflective vest", "A track wheelset"], "why": "There is no cycling in Hyrox. Wearables, audio and nutrition fit."}, {"q": "What is the key difference between a brevet and an ultra race like the Deccan Cliffhanger?", "a": ["An ultra race is a race with a support crew. A brevet is not a race and is self-supported", "A brevet is shorter than 100 km", "An ultra race is indoors", "There is no difference"], "why": "That difference changes the kit: bags for brevets, a light fast bike for crewed races."}, {"q": "A customer's Ironman is in 5 days and he wants to change his saddle today. What do you advise?", "a": ["Do not change anything now. Nothing new in the last week before a race", "Change it, new is always better", "Change the saddle and the shoes together", "Change the bike"], "why": "New equipment or position close to the event risks pain and injury on race day."}, {"q": "What is Everesting?", "a": ["Riding one climb repeatedly in a single ride until total climbing reaches 8,848 m", "Cycling to Everest base camp", "A 1,200 km brevet", "A triathlon held at altitude"], "why": "The total ascent must equal the height of Everest."}]}

function entry(u,q){return results[u+"_"+q]||{user_id:u,quiz:q,read:false,best:null,attempts:0};}
function passed(u,q){const e=entry(u,q);return e.best!==null&&e.best>=passMark(QUIZZES[q].size);}
function points(u){let s=0;Object.keys(QUIZZES).forEach(q=>{const e=entry(u,q);if(e.best!==null)s+=e.best;});return s;}

async function loadResults(){
  const r=await sb.from("academy_results").select("user_id,quiz,read,best,attempts");
  if(r.error){setNote("Scores could not be loaded. Check your connection and reload.");return;}
  const next={};
  (r.data||[]).forEach(d=>{
    if(!QUIZZES[d.quiz])return;
    const size=QUIZZES[d.quiz].size;
    next[d.user_id+"_"+d.quiz]={user_id:d.user_id,quiz:d.quiz,read:d.read===true,
      best:(typeof d.best==="number"&&d.best>=0&&d.best<=size)?d.best:null,attempts:Number(d.attempts)||0};
  });
  results=next; setNote("");
}
async function loadAll(uid){
  const p=await sb.from("profiles").select("id,name,role,store");
  if(p.error){setNote("Your profile could not be loaded. Check your connection and reload.");return;}
  me=(p.data||[]).find(x=>x.id===uid)||{id:uid,name:"",role:"",store:null};
  people=(p.data||[]).filter(x=>PLAY_ROLES.indexOf(x.role)>=0);
  await loadResults();
}
function record(q,patch){
  const e=Object.assign(entry(me.id,q),patch); results[me.id+"_"+q]=e;
  sb.from("academy_results").upsert({user_id:me.id,quiz:q,read:e.read,best:e.best,attempts:e.attempts,updated_at:new Date().toISOString()},{onConflict:"user_id,quiz"})
    .then(r=>{if(r.error)setNote("That result could not be saved. Check your connection. It will not show on the scoreboard until it saves.");});
}

  return `<article class="lesson"><a href="#home" class="sm">← All lessons</a>

      <div><button class="btn primary" id="start-quiz" data-quiz="${l.id}">I have read it. Start the quiz</button></div></div>`:""}</article>`;

function prep(x){const order=shuffle(x.a.map((_,i)=>i));return{q:x.q,opts:order.map(i=>x.a[i]),correct:order.indexOf(0),why:x.why};}
function startQuiz(id){
  stopTimer();
  const meta=QUIZZES[id]; let src;
  if(meta.kind==="lesson")src=shuffle(LESSONS.find(l=>l.id===id).quiz);
  else{const extra=CH_EXTRA[meta.track]||[], pool=shuffle(lessonsOf(meta.track).flatMap(l=>l.quiz)).slice(0,CH_SIZE-extra.length);src=shuffle(extra.concat(pool));}
  quiz={id,qs:src.map(prep),i:0,score:0,picked:null,answers:[],done:false,timed:meta.kind==="challenge",left:CH_SECONDS};
  if(quiz.timed)startTimer();
}
function startTimer(){
  stopTimer(); quiz.left=CH_SECONDS;
  tick=setInterval(()=>{
    if(!quiz||quiz.done){stopTimer();return;}
    quiz.left--;
    if(quiz.left<=0){answer(-1);return;}
    const t=document.getElementById("timer"); if(t){t.className="timer"+(quiz.left<=10?" low":"");t.querySelector("b").textContent=quiz.left+" s";t.querySelector("i").style.width=(quiz.left/CH_SECONDS*100)+"%";}
  },1000);
}
function answer(idx){
  if(!quiz||quiz.done||quiz.answers[quiz.i]!==undefined)return;
  quiz.answers[quiz.i]=idx; if(idx===quiz.qs[quiz.i].correct)quiz.score++;
  if(quiz.timed){advance();}else{quiz.picked=idx;app.innerHTML=quizHtml();const nx=document.getElementById("next");if(nx)nx.focus({preventScroll:true});}
}
function advance(){
  if(quiz.i+1<quiz.qs.length){quiz.i++;quiz.picked=null;if(quiz.timed)startTimer();}
  else finish();
  app.innerHTML=quizHtml(); window.scrollTo(0,0);
}
function finish(){
  stopTimer(); quiz.done=true;
  const meta=QUIZZES[quiz.id], e=entry(me.id,quiz.id), ok=quiz.score>=passMark(quiz.qs.length);
  const best=e.best===null?quiz.score:Math.max(e.best,quiz.score);
  record(quiz.id,{best,attempts:e.attempts+1,read:meta.kind==="lesson"?(ok||passed(me.id,quiz.id)):true});
}
function quizHtml(){
  const meta=QUIZZES[quiz.id], n=quiz.qs.length;
  if(quiz.done){
    const need=passMark(n), ok=quiz.score>=need, e=entry(me.id,quiz.id);
    const wrong=quiz.qs.map((q,i)=>({q,i,a:quiz.answers[i]})).filter(x=>x.a!==x.q.correct);
    const locked=meta.kind==="lesson"&&!e.read;
    return `<div class="quiz"><p class="eyebrow">${esc(meta.title)}</p>
      <div class="panel stack"><p class="score">${quiz.score}<span class="muted" style="font-size:1.2rem"> / ${n}</span></p>
      <h2>${ok?"Passed":"Not passed"}</h2>
      <p class="muted">${ok?(quiz.score===n?"Every answer right.":"You cleared the pass mark of "+need+"."):"You need "+need+" right to pass."} Your best so far is ${e.best}/${n}.${locked?" The quiz is locked until you read the lesson again.":""}</p>
      <div class="meta">${locked?`<a class="btn primary" href="#lesson-${meta.id}">Read the lesson again</a>`:`<button class="btn ${ok?"":"primary"}" id="retry">Try again</button>`}
        <a class="btn ${ok?"primary":""}" href="#home">Back to lessons</a></div></div>
      ${wrong.length?`<h3>Review what you missed</h3><div class="review">${wrong.map(x=>`<div class="item"><b>${esc(x.q.q)}</b>
        <span class="sm muted">Your answer: ${x.a===-1||x.a===undefined?"ran out of time":esc(x.q.opts[x.a])}</span>
        <span class="sm">Correct: ${esc(x.q.opts[x.q.correct])}. ${esc(x.q.why)}</span></div>`).join("")}</div>`:""}</div>`;
  }
  const cur=quiz.qs[quiz.i], answered=quiz.picked!==null;
  return `<div class="quiz">
    <div class="stack"><p class="eyebrow">${esc(meta.title)} · Question ${quiz.i+1} of ${n}</p>
    ${quiz.timed?`<div class="timer${quiz.left<=10?" low":""}" id="timer"><div class="qbar"><i style="width:${quiz.left/CH_SECONDS*100}%"></i></div><b>${quiz.left} s</b></div>`
      :`<div class="qbar"><i style="width:${Math.round((quiz.i+(answered?1:0))/n*100)}%"></i></div>`}</div>
    <p class="question">${esc(cur.q)}</p>
    <div class="opts">${cur.opts.map((o,i)=>`<button class="opt ${answered&&i===cur.correct?"right":""} ${answered&&i===quiz.picked&&i!==cur.correct?"wrong":""}" id="opt-${i}" data-opt="${i}" ${answered?"disabled":""}>${esc(o)}</button>`).join("")}</div>
    ${answered?`<div class="why ${quiz.picked===cur.correct?"ok":"no"}"><b>${quiz.picked===cur.correct?"Correct.":"Not quite."}</b> ${esc(cur.why)}</div>
      <div><button class="btn primary" id="next">${quiz.i+1===n?"See my score":"Next question"}</button></div>`:""}
  </div>`;
}
function scoresHtml(){
  const shown=people.filter(p=>WATCH_ONLY.indexOf(p.name)<0||Object.keys(QUIZZES).some(q=>results[p.id+"_"+q]));
  const rows=shown.map(p=>({p,lp:LESSONS.filter(l=>passed(p.id,l.id)).length,cp:TRACKS.filter(t=>passed(p.id,"ch-"+t.id)).length,pts:points(p.id)}))
    .sort((a,b)=>b.pts-a.pts||b.lp-a.lp);
  let h=`<div class="stack"><div class="stack"><h1>Scoreboard</h1>
    <p class="muted">Points are each person's best score on every quiz and challenge, added up. The most anyone can have is ${MAX_POINTS}.</p></div>`;
  if(!rows.some(r=>r.pts>0))h+=`<div class="panel"><p>No quiz has been taken yet. Scores appear here as soon as someone finishes their first quiz.</p></div>`;
  h+=`<div class="scroll"><table><tr><th>Name</th><th>Store</th><th class="num">Lessons passed</th><th class="num">Challenges passed</th><th class="num">Points</th></tr>
    ${rows.map(r=>`<tr><td class="${r.p.id===me.id?"you":""}">${esc(r.p.name)}</td><td>${esc(r.p.store||"Owner")}</td><td class="num">${r.lp} / ${LESSONS.length}</td><td class="num">${r.cp} / ${TRACKS.length}</td><td class="num"><b>${r.pts}</b></td></tr>`).join("")}</table></div>`;
  TRACKS.forEach(t=>{
    const items=lessonsOf(t.id).map(l=>QUIZZES[l.id]).concat([QUIZZES["ch-"+t.id]]);
    h+=`<h2>${esc(t.name)}</h2><div class="scroll"><table><tr><th>Quiz</th>${shown.map(p=>`<th class="num">${esc(p.name)}</th>`).join("")}</tr>
      ${items.map(q=>`<tr><td>${esc(q.title)}</td>${shown.map(p=>{const e=entry(p.id,q.id);
        return `<td class="num">${e.best!==null?`${e.best}/${q.size}${passed(p.id,q.id)?" ✓":""} <span class="muted">(${e.attempts})</span>`:(e.read?"read":"–")}</td>`;}).join("")}</tr>`).join("")}</table></div>`;
  });
  return h+`<p class="note">A tick means passed. The number in brackets is how many attempts it took.</p></div>`;
}

/* ---------- render and events ---------- */
let lastView="";
function render(){
  renderNav();
  if(!booted){app.innerHTML=`<p class="muted">Loading…</p>`;return;}
  if(!me){stopTimer();quiz=null;app.innerHTML=loginHtml();return;}
  const v=view();
  if(v.name==="quiz"){
    const meta=QUIZZES[v.id];
    const allowed=canPlay()&&(meta.kind==="lesson"?entry(me.id,v.id).read||(quiz&&quiz.id===v.id&&quiz.done):lessonsOf(meta.track).every(l=>passed(me.id,l.id)));
    if(!allowed){go(meta.kind==="lesson"?"lesson-"+v.id:"home");return;}
    if(!quiz||quiz.id!==v.id)startQuiz(v.id);
    app.innerHTML=quizHtml();
  }else{
    stopTimer(); quiz=null;
    app.innerHTML=v.name==="scores"?scoresHtml():v.name==="lesson"?lessonHtml(v.id):homeHtml();
    if(v.name==="scores")loadResults().then(()=>{if(view().name==="scores"&&me)app.innerHTML=scoresHtml();});
  }
  const key=v.name+(v.id||"");
  if(key!==lastView){window.scrollTo(0,0);lastView=key;}
}
document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="login")return;
  ev.preventDefault();
  const btn=document.getElementById("login-go"), err=document.getElementById("login-err");
  btn.disabled=true; err.hidden=true;
  const r=await sb.auth.signInWithPassword({email:document.getElementById("login-email").value.trim(),password:document.getElementById("login-password").value});
  if(r.error){btn.disabled=false;err.textContent=/invalid/i.test(r.error.message)?"That email or password is not right. Use your CRM login.":"Could not sign in. Check your connection and try again.";err.hidden=false;return;}
  await loadAll(r.data.user.id); render();
});
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button"); if(!b)return;
  if(b.dataset.track){openTrack=openTrack===b.dataset.track?null:b.dataset.track;try{localStorage.setItem("dbyk-academy-open",openTrack||"");}catch(e){}
    const y=window.scrollY;app.innerHTML=homeHtml();window.scrollTo(0,y);const nb=document.getElementById("acc-"+b.dataset.track);if(nb)nb.focus({preventScroll:true});return;}
  if(b.id==="signout"){await sb.auth.signOut();me=null;results={};people=[];location.hash="home";render();return;}
  if(b.id==="start-quiz"){const id=b.dataset.quiz;if(!entry(me.id,id).read)record(id,{read:true});quiz=null;go("quiz-"+id);return;}
  if(b.dataset.opt!==undefined&&quiz&&!quiz.done){answer(Number(b.dataset.opt));return;}
  if(b.id==="next"&&quiz){advance();return;}
  if(b.id==="retry"&&quiz){startQuiz(quiz.id);app.innerHTML=quizHtml();window.scrollTo(0,0);return;}
});
window.addEventListener("hashchange",render);
(async function boot(){
  render();
  try{const s=await sb.auth.getSession(); if(s.data&&s.data.session)await loadAll(s.data.session.user.id);}catch(e){setNote("Could not reach the server. Check your connection and reload.");}
  booted=true; render();
})();

</script>
</body></html>
